---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <footer style="text-align: center; padding: 20px 0; font-size: 0.85rem; color: #888; margin-top: 2rem;">
      <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 15px;">
      © {{ site.time | date: '%Y' }} Xuanru Dai &nbsp;|&nbsp; 
      <a href="https://github.com/RayeRen/acad-homepage.github.io" target="_blank" style="color: #888; text-decoration: underline;">acad</a> 
    </footer>

  </body>
</html>
